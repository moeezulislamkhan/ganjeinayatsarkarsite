# Example Nginx site for ganjeinayatsarkar.org  (copy to /etc/nginx/sites-available/, adjust paths, then enable)
server {
    listen 80;
    server_name ganjeinayatsarkar.org www.ganjeinayatsarkar.org;
    # After running:  sudo certbot --nginx -d ganjeinayatsarkar.org -d www.ganjeinayatsarkar.org
    # certbot adds the HTTPS (443) block and the redirect for you.

    root /var/www/ganj-e-inayat/frontend;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {                       # only the contact form and health check go to Python
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20k;
    }
    location /assets/ { expires 30d; add_header Cache-Control "public"; }
    location /data/   { expires 5m; }      # content files: edits show within minutes
    location / { try_files $uri $uri/ =404; }
}
